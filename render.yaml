services:
  - type: web
    name: perx-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: perx-runtime-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENV
        value: prod
      - key: SESSION_PATH
        value: /var/data/openwa-sessions
      - key: CHROME_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PERX_WA_BRIDGE_URL
        value: http://127.0.0.1:5002
      - key: WA_BRIDGE_PORT
        value: "5002"
      - key: WA_BRIDGE_INTERNAL_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
